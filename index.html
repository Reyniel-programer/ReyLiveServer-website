<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f172a;
      color: #fff;
      min-height: 100vh;
    }

    .hidden {
      display: none !important;
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
    }

    .btn-orange {
      background: #f59e0b;
      color: #000;
    }

    .btn-gray {
      background: #3f3f46;
      color: #fff;
    }

    .btn-red {
      background: #ef4444;
      color: #fff;
    }

    .btn-green {
      background: #22c55e;
      color: #000;
    }

    .section-box {
      background: #18181b;
      border-radius: 18px;
      padding: 20px;
      border: 1px solid #27272a;
    }

    .profile-cover {
      height: 220px;
      background: linear-gradient(135deg, #1d4ed8, #38bdf8);
      background-size: cover;
      background-position: center;
      position: relative;
    }

    .profile-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 20px;
      background: #18181b;
      border-bottom: 1px solid #27272a;
    }

    .profile-body {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px 40px;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
    }

    .profile-photo {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #f59e0b;
      background: #27272a;
    }

    .user-info-box {
      background: #0f172a;
      border: 1px solid #f59e0b33;
      border-radius: 14px;
      padding: 18px;
      margin-top: 14px;
      line-height: 2;
    }

    .upload-group {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .upload-group .btn {
      width: 100%;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .video-card {
      background: #27272a;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #3f3f46;
    }

    .video-player video,
    .video-player iframe {
      width: 100%;
      height: 180px;
      background: #000;
      border: 0;
    }

    .video-info {
      padding: 12px;
    }

    .post-box {
      background: #18181b;
      border-radius: 18px;
      padding: 20px;
      border: 1px solid #27272a;
      margin-top: 20px;
    }

    .post-card {
      background: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 14px;
      padding: 16px;
      margin-top: 12px;
    }

    .post-text {
      white-space: pre-wrap;
      line-height: 1.6;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-content {
      width: 100%;
      max-width: 360px;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 18px;
      padding: 18px;
      position: fixed;
      top: 100px;
      left: 50%;
      transform: translateX(-50%);
      cursor: grab;
      user-select: none;
    }

    .modal-content.dragging {
      cursor: grabbing;
      opacity: 0.95;
    }

    .calc-display {
      width: 100%;
      font-size: 28px;
      font-weight: bold;
      text-align: right;
      padding: 14px;
      margin-bottom: 14px;
      border-radius: 12px;
      background: #0f172a;
      color: #fff;
      overflow-x: auto;
      user-select: text;
    }

    .calc-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .calc-grid button {
      padding: 14px;
      font-size: 18px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      background: #3f3f46;
      color: #fff;
      font-weight: 700;
    }

    .calc-grid .calc-orange {
      background: #f59e0b;
      color: #000;
    }

    .calc-grid .calc-red {
      background: #ef4444;
    }

    @media (max-width: 768px) {
      .profile-body {
        grid-template-columns: 1fr;
      }

      .modal-content {
        width: calc(100% - 24px);
        max-width: none;
      }
    }
  </style>
</head>
<body>

  <!-- PROFILE SECTION -->
  <div id="profile-wrap">
    <div class="profile-cover" id="cover-bg"></div>

    <div class="profile-header">
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
        <img id="p-photo" class="profile-photo" src="https://via.placeholder.com/110" alt="Profile Photo">
        <div>
          <h2 id="p-name">User Name</h2>
          <p id="p-username-tag">@username</p>
        </div>
      </div>

      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button type="button" class="btn btn-orange" id="open-calculator-btn">Calculator</button>
        <button type="button" class="btn btn-gray" id="edit-profile-btn">Edit Profile</button>
      </div>
    </div>

    <div class="profile-body">
      <!-- LEFT SIDE -->
      <div class="section-box">
        <h3>User Information</h3>

        <div class="user-info-box" id="user-info">
          <div><strong>Email:</strong> example@email.com</div>
          <div><strong>Phone:</strong> 123456789</div>
          <div><strong>Age:</strong> 20</div>
          <div><strong>Gender:</strong> Male</div>
          <div><strong>Birthday:</strong> 2004-01-01</div>
          <div><strong>Address:</strong> Sample Address</div>
        </div>

        <div class="upload-group">
          <button type="button" class="btn btn-orange" id="photo-btn">Change Photo</button>
          <input type="file" id="photo-upload-input" accept="image/*" class="hidden" />
        </div>
      </div>

      <!-- RIGHT SIDE -->
      <div>
        <div class="section-box">
          <h3>My Videos</h3>
          <div id="video-grid" class="video-grid" style="margin-top:16px;"></div>
        </div>

        <div class="post-box">
          <h3>Posts & Comments</h3>
          <textarea id="post-text" rows="3" placeholder="Write a post..." style="width:100%;margin-top:12px;padding:12px;border-radius:12px;border:1px solid #3f3f46;background:#27272a;color:#fff;"></textarea>
          <button type="button" class="btn btn-orange" id="add-post-btn" style="margin-top:10px;">Add Post</button>
          <div id="posts-list" style="margin-top:16px;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- DRAGGABLE CALCULATOR -->
  <div id="calculator-modal" class="modal hidden">
    <div id="calculator-window" class="modal-content">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;">
        <h3>Calculator</h3>
        <button id="close-calculator-btn" class="btn btn-red">Close</button>
      </div>

      <div id="calc-display" class="calc-display">0</div>

      <div class="calc-grid">
        <button data-calc="C" class="calc-red">C</button>
        <button data-calc="⌫">⌫</button>
        <button data-calc="/">÷</button>
        <button data-calc="*">×</button>

        <button data-calc="7">7</button>
        <button data-calc="8">8</button>
        <button data-calc="9">9</button>
        <button data-calc="-">−</button>

        <button data-calc="4">4</button>
        <button data-calc="5">5</button>
        <button data-calc="6">6</button>
        <button data-calc="+">+</button>

        <button data-calc="1">1</button>
        <button data-calc="2">2</button>
        <button data-calc="3">3</button>
        <button data-calc="=" class="calc-orange">=</button>

        <button data-calc="0" style="grid-column: span 2;">0</button>
        <button data-calc=".">.</button>
      </div>
    </div>
  </div>

  <script>
    const calcModal = document.getElementById("calculator-modal");
    const calcWindow = document.getElementById("calculator-window");
    const calcDisplay = document.getElementById("calc-display");
    const calcGrid = document.querySelector(".calc-grid");
    const photoBtn = document.getElementById("photo-btn");
    const photoInput = document.getElementById("photo-upload-input");
    const profilePhoto = document.getElementById("p-photo");

    let calcValue = "0";

    document.getElementById("open-calculator-btn").addEventListener("click", () => {
      calcModal.classList.remove("hidden");
    });

    document.getElementById("close-calculator-btn").addEventListener("click", () => {
      calcModal.classList.add("hidden");
    });

    calcModal.addEventListener("click", (e) => {
      if (e.target === calcModal) {
        calcModal.classList.add("hidden");
      }
    });

    function updateCalc() {
      calcDisplay.textContent = calcValue;
    }

    function solve(expr) {
      try {
        if (!/^[0-9+\-*/.() ]+$/.test(expr)) return "Error";
        const result = Function(`"use strict"; return (${expr})`)();
        return Number.isFinite(result) ? String(result) : "Error";
      } catch {
        return "Error";
      }
    }

    calcGrid.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-calc]");
      if (!btn) return;

      const val = btn.dataset.calc;

      if (val === "C") {
        calcValue = "0";
      } else if (val === "⌫") {
        calcValue = calcValue.length > 1 ? calcValue.slice(0, -1) : "0";
      } else if (val === "=") {
        calcValue = solve(calcValue);
      } else {
        if (calcValue === "0" || calcValue === "Error") {
          calcValue = val;
        } else {
          calcValue += val;
        }
      }

      updateCalc();
    });

    // Drag support
    let isDragging = false;
    let offsetX = 0;
    let offsetY = 0;

    calcWindow.addEventListener("mousedown", (e) => {
      if (e.target.closest("button")) return;
      isDragging = true;
      calcWindow.classList.add("dragging");
      const rect = calcWindow.getBoundingClientRect();
      offsetX = e.clientX - rect.left;
      offsetY = e.clientY - rect.top;
      calcWindow.style.transform = "none";
      calcWindow.style.left = `${rect.left}px`;
      calcWindow.style.top = `${rect.top}px`;
    });

    document.addEventListener("mousemove", (e) => {
      if (!isDragging) return;
      calcWindow.style.left = `${e.clientX - offsetX}px`;
      calcWindow.style.top = `${e.clientY - offsetY}px`;
    });

    document.addEventListener("mouseup", () => {
      isDragging = false;
      calcWindow.classList.remove("dragging");
    });

    // Photo upload
    photoBtn.addEventListener("click", () => photoInput.click());

    photoInput.addEventListener("change", () => {
      const file = photoInput.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        profilePhoto.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });

    updateCalc();
  </script>
</body>
</html>
